{% extends "base.html" %}
{% block content %}
<h2>Import Pupils from Excel</h2>
<p class="text-muted">Upload an .xlsx file with a NAME column (and optionally ADA, PHONE).</p>
<form method="POST" enctype="multipart/form-data" class="row g-3">
    <div class="col-md-6"><label>Excel File</label>
        <input type="file" name="file" class="form-control" accept=".xlsx" required></div>
    <div class="col-md-6"><label>Class</label>
        <select name="class_id" class="form-select" required>
            <option value="">-- Select --</option>
            {% for c in classes %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
        </select></div>
    <div class="col-md-6"><label>Stream (optional)</label>
        <select name="stream_id" class="form-select">
            <option value="">-- None --</option>
            {% for s in streams %}<option value="{{ s.id }}">{{ s.class_.name }} - {{ s.name }}</option>{% endfor %}
        </select></div>
    <div class="col-12"><button class="btn btn-primary">Upload & Import</button></div>
</form>
{% endblock %}
