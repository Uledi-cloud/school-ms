{% extends "base.html" %}
{% block content %}
<h2>Select Pupil</h2>
<table class="table table-striped mt-3">
    <thead><tr><th>#</th><th>Name</th><th>Action</th></tr></thead>
    <tbody>
    {% for p in pupils %}
    <tr><td>{{ loop.index }}</td><td>{{ p.full_name }}</td>
        <td><a href="{{ url_for('generate_report', pupil_id=p.id, exam_id=exam_id) }}" class="btn btn-sm btn-success">View Report Card</a></td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
