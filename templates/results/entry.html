{% extends "base.html" %}
{% block content %}
<h2>Enter Results</h2>
<form method="GET" class="row g-2 mb-4">
    <div class="col-md-3">
        <label>Class</label>
        <select name="class_id" class="form-select" onchange="this.form.submit()">
            <option value="">-- Select --</option>
            {% for c in classes %}
            <option value="{{ c.id }}" {% if class_id==c.id %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <label>Stream</label>
        <select name="stream_id" class="form-select" onchange="this.form.submit()">
            <option value="">All</option>
            {% for s in streams %}
            <option value="{{ s.id }}" {% if stream_id==s.id %}selected{% endif %}>{{ s.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <label>Examination</label>
        <select name="exam_id" class="form-select" onchange="this.form.submit()">
            <option value="">-- Select --</option>
            {% for e in exams %}
            <option value="{{ e.id }}" {% if exam_id==e.id %}selected{% endif %}>{{ e.name }} {{ e.term }} {{ e.year }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <label>Subject</label>
        <select name="subject_id" class="form-select" onchange="this.form.submit()">
            <option value="">-- Select --</option>
            {% for s in subjects %}
            <option value="{{ s.id }}" {% if subject_id==s.id %}selected{% endif %}>{{ s.name }}</option>
            {% endfor %}
        </select>
    </div>
</form>
{% if pupils and exam_id and subject_id %}
<form method="POST">
    <input type="hidden" name="exam_id" value="{{ exam_id }}">
    <input type="hidden" name="subject_id" value="{{ subject_id }}">
    <table class="table table-bordered">
        <thead class="table-primary"><tr><th>#</th><th>Pupil</th><th>Marks</th></tr></thead>
        <tbody>
        {% for p in pupils %}
        <tr><td>{{ loop.index }}</td><td>{{ p.full_name }}</td>
            <td><input type="number" step="0.01" min="0" max="100" name="mark_{{ p.id }}" class="form-control" value="{{ existing.get(p.id, '') }}"></td></tr>
        {% endfor %}
        </tbody>
    </table>
    <button class="btn btn-success">Save Results</button>
</form>
{% endif %}
{% endblock %}
