{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between">
    <h2>Staff</h2>
    <a href="{{ url_for('add_staff') }}" class="btn btn-primary">+ Add Staff</a>
</div>
<table class="table table-striped mt-3">
    <thead><tr><th>ID</th><th>Name</th><th>Role</th><th>Phone</th><th>Email</th><th>Actions</th></tr></thead>
    <tbody>
    {% for s in staff %}
    <tr><td>{{ s.id }}</td><td>{{ s.first_name }} {{ s.last_name }}</td>
        <td>{{ s.role }}</td><td>{{ s.phone or '-' }}</td><td>{{ s.email or '-' }}</td>
        <td>
            <a href="{{ url_for('edit_staff', id=s.id) }}" class="btn btn-sm btn-warning">Edit</a>
            <a href="{{ url_for('delete_staff', id=s.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete?')">Del</a>
        </td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
