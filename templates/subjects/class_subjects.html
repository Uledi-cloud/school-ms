{% extends "base.html" %}
{% block page_title %}Subjects for {{ cls.name }}{% endblock %}
{% block content %}
<h2 class="fw-bold" style="color:#1e3a8a;">
    <i class="fa fa-book"></i> Subjects — {{ cls.name }}
</h2>
<p class="text-muted">Tick the subjects offered by this class.</p>

<div class="card-modern">
    <form method="POST">
        <div class="row g-3">
            {% for subj in all_subjects %}
            <div class="col-md-4">
                <label class="d-flex align-items-center gap-2 p-2 rounded"
                       style="background:#f8fafc; border:1px solid #e2e8f0; cursor:pointer;">
                    <input type="checkbox" name="subject_ids" value="{{ subj.id }}"
                           {% if subj.id in selected_ids %}checked{% endif %}>
                    <span class="fw-bold" style="color:#1e3a8a;">{{ subj.name }}</span>
                </label>
            </div>
            {% endfor %}
        </div>
        <div class="mt-4">
            <button class="btn btn-lg text-white" style="background:#1e3a8a;">
                <i class="fa fa-save"></i> Save Subjects
            </button>
            <a href="{{ url_for('classes') }}" class="btn btn-lg btn-secondary">Back</a>
        </div>
    </form>
</div>
{% endblock %}
