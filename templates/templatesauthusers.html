{% extends 'base.html' %}
{% block content %}
<h2>Users</h2>
<a href="{{ url_for('auth.register') }}" class="btn btn-primary mb-3">+ New User</a>
<table class="table table-striped">
    <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Active</th><th>Actions</th></tr></thead>
    <tbody>
    {% for u in users %}
    <tr>
        <td>{{ u.id }}</td><td>{{ u.username }}</td><td>{{ u.email }}</td>
        <td><span class="badge bg-secondary">{{ u.role }}</span></td>
        <td>{{ 'Yes' if u.is_active_flag else 'No' }}</td>
        <td><a href="{{ url_for('auth.toggle_user', id=u.id) }}" class="btn btn-sm btn-warning">Toggle</a></td>
    </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
