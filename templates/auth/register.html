{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Register User</h2>
        {% if first_user %}
        <div class="alert alert-info">First user becomes admin.</div>
        {% endif %}
        <form method="POST">
            <div class="mb-3"><label>Username</label><input name="username" class="form-control" required></div>
            <div class="mb-3"><label>Email</label><input name="email" type="email" class="form-control" required></div>
            <div class="mb-3"><label>Password</label><input name="password" type="password" class="form-control" required></div>
            <div class="mb-3"><label>Phone</label><input name="phone" class="form-control"></div>
            <div class="mb-3">
                <label>Role</label>
                <select name="role" class="form-select">
                    <option value="admin">Admin</option>
                    <option value="teacher">Teacher</option>
                    <option value="parent">Parent</option>
                </select>
            </div>
            <button class="btn btn-primary">Create User</button>
        </form>
    </div>
</div>
{% endblock %}
