{% extends "base.html" %}
{% block content %}
<h2>{{ title }}</h2>
<form method="POST" class="row g-3">
    {{ form.hidden_tag() }}
    <div class="col-md-6">{{ form.name.label }}{{ form.name(class="form-control") }}</div>
    <div class="col-md-6">{{ form.level.label }}{{ form.level(class="form-select") }}</div>
    <div class="col-12">{{ form.submit(class="btn btn-primary") }}</div>
</form>
{% endblock %}
